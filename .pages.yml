# Pages CMS configuration (https://pagescms.org/docs/configuration/)
# Pages CMS commits to the SOURCE files only. The live site is the pre-built docs/
# folder: after editing here, rebuild docs/ as described in README.md (Publishing).

media:
  - name: images
    label: Images
    input: assets/images
    output: assets/images        # front matter paths have no leading slash
    categories: [image]

content:
  # ---------------------------------------------------------------- Blog
  - name: posts
    label: Blog
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      search: [title, description]
      default:
        sort: date
        order: desc
    # Only the keys used by the posts are listed: a boolean added here (e.g.
    # `published`) could be written as false into posts that do not have it.
    fields:
      - name: layout
        type: string
        hidden: true
        default: default-full
      - name: header_type
        type: string
        hidden: true
        default: hero
      - name: title
        label: Title
        type: string
        required: true
        description: Shown in the blog list and in the browser tab.
      - name: header_title
        label: Header title
        type: string
        description: Big title in the page header (usually the title, shorter).
      - name: subtitle
        label: Subtitle
        type: string
      - name: date
        label: Date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss"
      - name: description
        label: Description
        type: text
        description: Summary for the blog list and social previews.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: categories
        label: Categories
        type: string
        list: true
        default: [news]
      - name: header_img
        label: Social preview image
        type: image
        description: og:image, generated by scripts/make_og_images.py into assets/images/og/. Empty = assets/images/og-blog.png.
        options:
          media: images
          path: og
      - name: body
        label: Content
        type: code
        description: Markdown with HTML and Liquid ({{ site.baseurl }}, includes). Kept as is.
        options:
          format: markdown

  # ---------------------------------------------------------------- Pages
  - name: pages
    label: Pages
    type: collection
    path: _pages
    format: yaml-frontmatter
    subfolders: false
    # Old, unlinked pages (noindex, not to be integrated)
    exclude:
      - hard_way.markdown
      - jekyll_installation_guide.markdown
      - llms.markdown
      - olympics.markdown
      - politics.markdown
      - scenario.markdown
      - yclient.markdown
    filename:
      template: "{primary}.markdown"
      field: create
    view:
      fields: [title, eyebrow]
      primary: title
      sort: [title]
      search: [title, subtitle]
      default:
        sort: title
        order: asc
    fields:
      - name: layout
        type: string
        hidden: true
        default: default-full
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: eyebrow
        label: Eyebrow
        type: string
        description: Small label above the header title (e.g. "Platform", "Agents").
      - name: header_title
        label: Header title
        type: string
      - name: header_type
        label: Header type
        type: select
        default: hero
        options:
          values: [hero, none]
      - name: show_sidetoc
        label: Side table of contents
        type: boolean
        default: true
      - name: header_img
        label: Social preview image
        type: image
        description: og:image card in assets/images/og/. Empty = assets/images/og-default.png.
        options:
          media: images
          path: og
      - name: body
        label: Content
        type: code
        description: Markdown with HTML and Liquid. Kept as is.
        options:
          format: markdown

  # ---------------------------------------------------------------- Data
  - name: data
    label: Data
    type: group
    items:
      - name: citations
        label: Publications (Resources)
        type: file
        path: _data/citations.yml
        format: yaml
        list: true
        fields:
          - name: year
            label: Year
            type: number
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: authors
            label: Authors
            type: string
          - name: venue
            label: Venue
            type: string
            description: Journal, conference, arXiv id or "PhD thesis".

      # Raw editor on purpose: the file contains commented-out blocks that a
      # structured form would drop on save.
      - name: plugins
        label: Plugins list (YAML)
        type: file
        path: _data/plugins.yml
        format: code
