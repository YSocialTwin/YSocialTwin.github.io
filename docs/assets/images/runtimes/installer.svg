<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="The YSocial desktop installer: a window with an Install YSocial button and a progress bar, next to macOS, Windows and Linux badges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2a37"/><stop offset="1" stop-color="#25205a"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6dc3d0"/><stop offset="1" stop-color="#8984cd"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
<circle cx="1050" cy="90" r="260" fill="#6dc3d0" opacity=".10"/>
<circle cx="120" cy="700" r="220" fill="#8984cd" opacity=".12"/>
