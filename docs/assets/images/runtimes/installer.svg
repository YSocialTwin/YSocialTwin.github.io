<circle cx="285" cy="138" r="8" fill="#ff5f57"/><circle cx="312" cy="138" r="8" fill="#febc2e"/><circle cx="339" cy="138" r="8" fill="#28c840"/>
<text x="600" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#5b6675">YSocial Installer</text>
</g>
<g transform="translate(600 270)">
<circle r="52" fill="url(#g1)"/>
<g fill="#fff" opacity=".92"><circle cx="-18" cy="-14" r="9"/><circle cx="18" cy="-14" r="9"/><circle cx="0" cy="12" r="9"/><circle cx="-22" cy="16" r="6"/><circle cx="22" cy="16" r="6"/></g>
</g>
<text x="600" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#1d2733">YSocial 4.0.0</text>
<text x="600" y="402" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#5b6675">No terminal, no Python.</text>
