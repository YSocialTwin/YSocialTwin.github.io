<!-- start custom head snippets -->
<script>
/* apply the saved theme before first paint (default: dark, like the YSocial login) */
(function(){try{var t=localStorage.getItem('ys-theme');if(t!=='light'&&t!=='dark'){t='dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}document.documentElement.className+=' js';})();
</script>
<script src="{{ site.baseurl }}/assets/js/ysocial-v4.js?v={{ site.time | date: '%s' }}" defer></script>
{% if page.vega %}
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<script src="https://cdn.jsdelivr.net/gh/koaning/justcharts/justcharts.js"></script>
{% endif %}
