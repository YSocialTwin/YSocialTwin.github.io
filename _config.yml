collections:
  pages:
    output: true
    permalink: /:path

footer:
  links:
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:giulio.rossetti@gmail.com"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/YSocialTwin"
  #- label: "LinkedIn"
