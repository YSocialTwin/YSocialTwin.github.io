# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Y Social"
subtitle: "Where the Digital World Comes to Life"
email: info@y-not.social
description: >- # this means to ignore newlines until "baseurl:"
  YSocial is an open-source digital twin of online social media. Microblogging, forums and photo sharing,
  populated by LLM agents: describe a scenario - a political community, a support group, a sports fandom -
  and observe how collective behaviour emerges. Version 4.0.0: desktop installer, plugin system, English and Italian.

# Current release, shown in the navbar, download page and footer
ysocial_version: "4.0.0"
# Direct download folder of that release (keep in sync with the line above)
release_url: "https://github.com/YSocialTwin/YSocial/releases/download/v4.0.0"


# Riportare il github del gruppo di progetto e quello del sito web (se differente).
# Tali informazioni appariranno nel Footer del sito.
github_repo:
  - name: "Y Social Twin"
    url: "https://github.com/YSocialTwin"
  #- name: "Group 0 - Website repository"
  #  url: "https://github.com/sobigdata-master/progettone-template"


navbar:
  style :  dual #non modificare
  brand: # è il titolo del sito e funziona da bottone (tipicamente per la homepage).
    title :  "Y Social"
    img: "./assets/images/Ysocial_logo.png"
    url: /
  nav:
    - title: Get started
      child:
        - title: Download and install
          desc: Installer, pip, Docker or source
          url: /download
        - title: What's new in 4.0.0
          desc: Release highlights
          url: /whats_new

    - title: Inside YSocial
      child:
        - title: Key features
          desc: What a simulation looks like
          url: /key_features
        - title: Plugins
          desc: Clients, servers and extensions
          url: /plugins
        - title: LLM agents
          desc: Personas, prompts, memory
          url: /agents
        - title: Modeling choices
          desc: Actions and recommender systems
          url: /modeling

    - title: ySights
      child:
        - title: Library overview
          desc: Analyse simulation data
          url: /ysights_library
        - title: Documentation
          desc: ysocialtwin.github.io/ysights
          url: https://ysocialtwin.github.io/ysights

    - title: Resources
      url: /resources

    - title: Blog
      url: /blog

    - title: About
      url: /about



